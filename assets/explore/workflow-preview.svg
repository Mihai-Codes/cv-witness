<svg id="flowsvg" width="600" viewBox="0 0 428 814" role="img" aria-roledescription="flowchart" aria-labelledby="flowsvg-title" aria-describedby="flowsvg-desc" xmlns="http://www.w3.org/2000/svg"><style>:root{ --bg:#e8eef5;--grid:#d3dded;--card-bg:#f8fafc;--border:#cbd5e1;--border-hi:#94a3b8;--text:#0f172a;--subtext:#64748b;--legend-text:#475569;--footer:#94a3b8;--flow-node-fill:rgba(5,150,105,0.08);--flow-node-stroke:#059669;--flow-pill-fill:rgba(4,120,87,0.12);--flow-pill-stroke:#047857;--flow-conn:#059669;--flow-dot:#059669;--arch-conn:#64748b;--arch-async:#ea580c;--arch-auth:#e11d48;--arch-dot:#0891b2;--node-base:#ffffff;--region:#d97706;--subnet:#e11d48;--capsule-fill:rgba(8,145,178,0.12);--capsule-text:#0e7490;--t-frontend-fill:rgba(8,145,178,0.10);--t-frontend-stroke:#0891b2;--t-backend-fill:rgba(5,150,105,0.10);--t-backend-stroke:#059669;--t-database-fill:rgba(124,58,237,0.10);--t-database-stroke:#7c3aed;--t-cloud-fill:rgba(217,119,6,0.10);--t-cloud-stroke:#d97706;--t-security-fill:rgba(225,29,72,0.10);--t-security-stroke:#e11d48;--t-bus-fill:rgba(234,88,12,0.10);--t-bus-stroke:#ea580c;--t-external-fill:rgba(100,116,139,0.10);--t-external-stroke:#64748b;--accent-0:#0891b2;--accent-1:#7c3aed;--accent-2:#e11d48;--accent-3:#059669;--pulse:#059669; }text{font-family:ui-monospace,Menlo,monospace}</style><title id="flowsvg-title">Checked CV export animated diagram</title><desc id="flowsvg-desc">Top-down flow diagram; dashed connectors animate in the direction of flow and glowing dots ride the main paths.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></marker><filter id="glow" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="2.6" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge></filter><symbo
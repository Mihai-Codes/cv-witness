<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>cv-witness banner</title>
<style>
  /* Render in Chromium at 2100 x 900 CSS pixels.
     The wordmark is text and the logo is shared with the landing page. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 2100px; height: 900px; overflow: hidden; }
  body {
    background:
      radial-gradient(ellipse 55% 85% at 50% 52%, #191d25 0%, rgba(13,17,23,0) 68%),
      #0d1117;
    display: flex; align-items: center; justify-content: center;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  .lockup { display: flex; align-items: center; gap: 64px; }
  .mark { width: 168px; height: 168px; }
  .word {
    color: #f0f3f6; font-size: 96px; font-weight: 500;
    letter-spacing: 1px; line-height: 1; font-variant-ligatures: none;
  }
  .tag {
    margin-top: 18px; color: #8b949e;
    font-size: 32px; font-weight: 400; letter-spacing: 0.3px;
  }
</style>
</head>
<body>
  <div class="lockup">
    <img class="mark" src="mark.svg" width="168" height="168" alt="">
    <div>
      <div class="word">cv-witness</div>
      <div class="tag">tailored CVs, nothing invented</div>
    </div>
  </div>
</body>
</html>

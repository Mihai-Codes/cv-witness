<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<style>
@page { size: A4; margin: 16mm 14mm; }
* { box-sizing: border-box; }
body { margin: 0; color: #171717; font: 10.5pt/1.35 Arial, Helvetica, sans-serif; overflow-wrap: anywhere; }
header { margin-bottom: 12pt; }
h1 { font-size: 20pt; line-height: 1.15; margin: 0 0 4pt; }
.role { font-size: 11pt; margin: 0 0 4pt; }
.contact { font-size: 9.5pt; line-height: 1.4; margin: 0; }
a { color: inherit; text-decoration: underline; }
h2 { font-size: 11pt; margin: 11pt 0 5pt; padding-bottom: 2pt; border-bottom: .6pt solid #707070; break-after: avoid; }
h3 { font-size: 10.5pt; margin: 6pt 0 2pt; break-after: avoid; }
p { margin: 0 0 4pt; orphans: 3; widows: 3; }
.entry { margin-bottom: 7pt; }
.metadata { margin-bottom: 3pt; }
ul { margin: 2pt 0 5pt; padding-left: 18px; list-style-position: outside; }
li { padding-left: 0; margin: 0 0 3pt; orphans: 2; widows: 2; }
section { break-inside: auto; }
.compact { break-inside: avoid; }
</style>
</head>
<body>
{{CONTENT}}
</body>
</html>

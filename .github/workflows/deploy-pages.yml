name: Deploy landing page to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - "assets/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage only site files (keeps the repo's plugin symlink out of the artifact)
        run: |
          mkdir -p site
          cp index.html site/
          cp -R assets site/assets
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

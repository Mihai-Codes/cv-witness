name: Test local CV workflows

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-tests:
    name: Synthetic workflows · ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.14"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CV_WITNESS_REQUIRE_PDF_TESTS: "1"
      CV_WITNESS_CI_NO_SANDBOX: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install missing PDF tools on Linux
        if: runner.os == 'Linux'
        run: |
          if ! command -v pdfinfo >/dev/null || ! command -v pdftotext >/dev/null || ! command -v pdftoppm >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi
      - name: Install missing PDF tools on macOS
        if: runner.os == 'macOS'
        run: |
          if ! command -v pdfinfo >/dev/null || ! command -v pdftotext >/dev/null || ! command -v pdftoppm >/dev/null; then
            brew install --quiet poppler
          fi
      - name: Require actual browser and PDF tools
        run: |
          python -c "from scripts.render_cv import browser_path; print('Browser ready:', browser_path())"
          command -v pdfinfo
          command -v pdftotext
          command -v pdftoppm
      - name: Bounded fictional browser smoke check
        timeout-minutes: 2
        run: python -u scripts/ci_pdf_smoke.py
      - name: Test fictional exports, strict failures and private corpus handling
        timeout-minutes: 6
        run: python -u -m unittest discover -s tests -v
      - name: Check the distributable commands
        run: |
          python scripts/voice_corpus.py --help
          python scripts/check_cv.py --help
          python scripts/render_cv.py --help
      - name: Ensure tests left no checkout artifacts
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

  voice-test-gate:
    name: Voice corpus tests
    runs-on: ubuntu-latest
    needs: [synthetic-tests]
    if: ${{ always() }}
    steps:
      - name: Require every synthetic test job to pass
        env:
          MATRIX_RESULT: ${{ needs.synthetic-tests.result }}
        run: |
          if [ "$MATRIX_RESULT" != "success" ]; then
            printf 'Synthetic test matrix did not succeed (%s).\n' "$MATRIX_RESULT"
            exit 1
          fi
